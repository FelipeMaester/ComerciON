services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor de e-mail de mentira, para o desenvolvimento e para a suíte de
  # testes. Guarda tudo em memória e mostra numa interface web — nada sai para
  # a internet.
  #
  #   docker compose --profile dev up -d      (sobe junto com o resto)
  #   http://localhost:8025                   (a caixa de entrada)
  #
  # Fica num profile porque produção manda e-mail de verdade: subir isto lá
  # seria engolir em silêncio a redefinição de senha de quem precisa entrar.
  #
  # Sem ele, o teste de "esqueci minha senha" se PULA — e esse teste é o único
  # que cobre a costura entre API, e-mail e duas telas.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  # Backup automático diário. Fica num profile porque nem toda instalação
  # quer isto (em produção séria o backup costuma ser do provedor gerenciado),
  # mas quem sobe o compose e esquece de configurar cron fica sem NENHUM
  # backup — e é justamente essa a instalação que mais precisa.
  #
  #   docker compose --profile backup up -d
  #
  # Usa a mesma imagem do Postgres para o pg_dump ter exatamente a versão do
  # servidor. Roda o dump ao subir e depois a cada BACKUP_INTERVAL_HOURS.
  backup:
    image: postgres:16-alpine
    profiles: ['backup']
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-erp}
      PGUSER: ${POSTGRES_USER:-erp}
      PGDATABASE: ${POSTGRES_DB:-erp}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      KEEP_MINIMUM: ${BACKUP_KEEP_MINIMUM:-3}
      INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # Destino remoto no formato do rclone. Vazio = backup só nesta máquina.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - ./backups:/backups
      # Pasta com o rclone.conf gerado por 'rclone config'. É a PASTA que é
      # montada, e não o arquivo: quando um bind-mount aponta para um arquivo
      # que não existe, o Docker cria um DIRETÓRIO com aquele nome no host —
      # e aí o rclone tenta ler um diretório como configuração. Montando a
      # pasta, o pior caso é ela nascer vazia.
      - ${RCLONE_CONFIG_DIR:-./rclone}:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu

        # rclone só é instalado se houver destino configurado: sem isso, cada
        # reinício do container gastaria uma ida à rede sem motivo.
        if [ -n "$${BACKUP_REMOTE:-}" ] && ! command -v rclone > /dev/null 2>&1; then
          echo "[$$(date '+%F %T')] Instalando rclone para o envio remoto…"
          apk add --no-cache rclone
        fi

        while true; do
          STAMP=$$(date +%Y%m%d-%H%M%S)
          TARGET="/backups/comercion-$$STAMP.dump"
          echo "[$$(date '+%F %T')] Backup -> $$TARGET"

          if pg_dump -h postgres -Fc --no-owner --no-privileges > "$$TARGET"; then
            # Mesma verificação do scripts/backup-db.sh: lê o dump INTEIRO.
            # 'pg_restore --list' aprovaria um arquivo truncado, porque lê só
            # o índice do começo — já testado, não trocar por ele.
            if pg_restore -f /dev/null < "$$TARGET" > /dev/null 2>&1; then
              echo "[$$(date '+%F %T')] OK ($$(wc -c < "$$TARGET") bytes)"

              # Cópia fora do servidor. O dump local NUNCA é apagado por falha
              # aqui: ele está íntegro, e o que faltou foi só a segunda cópia.
              if [ -n "$${BACKUP_REMOTE:-}" ]; then
                NOME=$$(basename "$$TARGET")
                if rclone copy "$$TARGET" "$$BACKUP_REMOTE" && \
                   rclone lsf "$$BACKUP_REMOTE" --include "$$NOME" | grep -qx "$$NOME"; then
                  echo "[$$(date '+%F %T')] Cópia remota confirmada em $$BACKUP_REMOTE"
                else
                  echo "[$$(date '+%F %T')] ERRO: envio para $$BACKUP_REMOTE falhou. O backup local está OK; a cópia remota NÃO existe." >&2
                fi
              fi
            else
              echo "[$$(date '+%F %T')] ERRO: dump ilegível, descartado" >&2
              rm -f "$$TARGET"
            fi
          else
            echo "[$$(date '+%F %T')] ERRO: pg_dump falhou" >&2
            rm -f "$$TARGET"
          fi

          # Retenção preservando sempre os N mais recentes.
          TOTAL=$$(ls -1 /backups/comercion-*.dump 2>/dev/null | wc -l)
          if [ "$$TOTAL" -gt "$$KEEP_MINIMUM" ]; then
            ls -1t /backups/comercion-*.dump | tail -n +$$((KEEP_MINIMUM + 1)) | while read -r OLD; do
              if [ -n "$$(find "$$OLD" -mtime +$$RETENTION_DAYS 2>/dev/null)" ]; then
                echo "[$$(date '+%F %T')] Removendo antigo: $$OLD"
                rm -f "$$OLD"
              fi
            done
          fi

          sleep $$((INTERVAL_HOURS * 3600))
        done

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp}@postgres:5432/${POSTGRES_DB:-erp}
      # O fuso do servidor É a definição de "hoje" para o sistema inteiro.
      #
      # O código lê data pura no fuso do processo de propósito (ver
      # common/data-da-consulta.ts) — mas ninguém dizia ao processo qual era.
      # Sem isto o container roda em UTC, e das 21h à meia-noite o Brasil
      # inteiro já está "amanhã": a venda das 21h30 entra no dia seguinte, o
      # relatório do dia que a pessoa acabou de trabalhar volta zerado, e o
      # fechamento de caixa parte a noite em dois. Nada disso dá erro.
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* é inlineado no bundle do navegador em build time pelo
      # Next.js — precisa ser build arg, não env var de runtime do container.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api


volumes:
  postgres_data:
