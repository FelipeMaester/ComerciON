name: CI

on:
  push:
    branches: [master]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch: sem isso, uma
# sequência de commits enfileira builds que já nasceram obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Segredos de teste, propositalmente fracos e fixos: só existem dentro do
  # runner efêmero. Os de produção nunca passam por aqui.
  DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_ci
  JWT_ACCESS_SECRET: ci-access
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_SECRET: ci-refresh
  JWT_REFRESH_EXPIRES_IN: 7d

jobs:
  api:
    name: API — tipos e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O client do Prisma é gerado, não versionado: sem isto o type-check
      # falha em tudo que importa @prisma/client.
      - run: pnpm --filter api exec prisma generate

      - name: Verificação de tipos
        run: pnpm --filter api exec tsc --noEmit

      # O lint pega o que o compilador não pega: import órfão, variável que
      # ficou para trás numa refatoração, caractere invisível no meio do
      # código. Sem ele aqui, volta a sujar sozinho — os 14 erros que
      # limpamos entraram assim, um a um, sem ninguém rodar `pnpm lint`.
      #
      # As exceções do projeto (a desestruturação que remove a senha da
      # resposta, os parâmetros ignorados de propósito) estão declaradas em
      # apps/api/.eslintrc.js, então nada aqui pede desativar regra na linha.
      - name: Lint
        run: pnpm --filter api exec eslint src --ext .ts

      - name: Testes
        run: pnpm --filter api exec jest --ci

  migrations:
    name: Migrations aplicam num banco vazio
    runs-on: ubuntu-latest

    # Este job existe por causa de um erro concreto e recorrente: o Prisma
    # ordena as migrations pelo NOME da pasta. Uma migration criada à mão com
    # timestamp "redondo" pode ordenar antes de outra já aplicada, e aí tudo
    # continua funcionando no banco de desenvolvimento (que já tem o histórico)
    # e quebra só na primeira instalação limpa — em produção, no pior momento.
    # Aqui isso vira uma falha de CI em vez de uma descoberta no cliente.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar todas as migrations do zero
        run: pnpm --filter api exec prisma migrate deploy

      # migrate deploy passa mesmo se o schema.prisma tiver mudado sem gerar
      # migration. `migrate diff --exit-code` acusa essa divergência.
      - name: Schema e migrations estão em sincronia
        run: |
          pnpm --filter api exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "Em sincronia." \
          || (echo "::error::schema.prisma mudou sem migration correspondente. Rode 'prisma migrate dev'." && exit 1)

  web:
    name: Painel — tipos e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate

      - name: Verificação de tipos (painel)
        run: pnpm --filter web exec tsc --noEmit

      # Sem `--max-warnings`: o painel tem avisos legítimos e permanentes de
      # `<img>` (a logo da loja viaja como data URI, e o next/image não serve
      # para isso). Transformá-los em erro obrigaria a desativar a regra caso
      # a caso, trocando um aviso honesto por um comentário de silenciamento.
      # O que precisa falhar a CI é erro, e desses não há nenhum.
      - name: Lint (painel)
        run: pnpm --filter web lint

      # O build pega o que o type-check não pega — por exemplo, useSearchParams
      # sem limite de Suspense, que só falha ao pré-renderizar.
      - name: Build do painel
        run: pnpm --filter web exec next build


  e2e:
    name: Ponta a ponta (navegador)
    runs-on: ubuntu-latest
    # Roda depois dos rápidos: não vale gastar 5 minutos de navegador para
    # descobrir no fim que o type-check já estava quebrado.
    needs: [api, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Servidor SMTP de teste: guarda tudo em memória e expõe API HTTP. É
      # como o teste de "esqueci minha senha" lê o link do e-mail.
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']

    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_e2e
      MAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: ComerciON <ci@teste.local>
      WEB_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Uma loja por subdomínio. O teste correspondente usa um domínio
      # registrável de verdade resolvido para 127.0.0.1 pelo navegador —
      # .localhost não serve, porque o navegador trata cada x.localhost como
      # um site diferente e o cookie de sessão não atravessaria.
      TENANT_BASE_DOMAIN: painel.comercion-teste.com
      NEXT_PUBLIC_TENANT_BASE_DOMAIN: painel.comercion-teste.com
      CORS_ORIGIN: http://localhost:3000
      # A suíte cria dezenas de lojas e faz login em todas em poucos segundos,
      # tudo do mesmo IP — bem acima do que qualquer loja real faz. Sem subir
      # o teto aqui, metade dos testes tomaria 429 e pareceria defeito.
      # O padrão de produção (20/min) continua valendo onde importa.
      LOGIN_RATE_LIMIT: '500'
      # Mesma razao para o teto geral: uma execucao da suite passou de 100
      # chamadas num minuto e derrubou a tela Minha conta com 429 — que
      # parecia defeito da tela, e nao do ambiente.
      GLOBAL_RATE_LIMIT: '2000'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy

      # Os planos precisam existir: a suíte cria cada loja no plano premium
      # para não bater no gate de módulo a cada teste.
      - run: pnpm --filter api exec prisma db seed

      - name: Instalar o navegador
        run: pnpm --filter e2e exec playwright install chromium --with-deps

      - name: Compilar e subir os três apps
        run: |
          pnpm --filter api build
          pnpm --filter web build
          node apps/api/dist/src/main.js &
          pnpm --filter web exec next start -p 3000 &

      # Esperar de verdade em vez de dormir um número mágico de segundos:
      # em runner lento o sleep fixo falha, e em runner rápido desperdiça.
      - name: Esperar os apps responderem
        run: |
          npx --yes wait-on -t 120000 \
            http://localhost:3001/api/health \
            http://localhost:3000/login

      - name: Testes de ponta a ponta
        run: pnpm --filter e2e test

      # O rastro é o que permite entender uma falha que não reproduz na
      # máquina de quem for investigar: tem vídeo, screenshot e a rede.
      - name: Guardar o rastro das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rastro
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  scripts:
    name: Scripts de shell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Os scripts de backup rodam em Linux mas são editados no Windows. Sem
      # esta checagem, um CRLF que escape do .gitattributes só apareceria no
      # servidor, como "bad interpreter: /usr/bin/env bash^M".
      - name: Sem CRLF nos scripts
        run: |
          if grep -rlU $'\r' scripts/*.sh; then
            echo "::error::script com CRLF — precisa ser LF (ver .gitattributes)"
            exit 1
          fi
          echo "Todos em LF."

      - name: Análise estática com shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
